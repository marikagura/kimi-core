name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Real Postgres so the DB-gated integration suite actually runs in CI —
    # without it all *.integration.test.ts files skip (their guard requires a
    # localhost DATABASE_URL) and the SQL core (retrieval CTE, derive/sweep,
    # digest dedup, graph walk) is only ever verified on the author's machine.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kimi
          POSTGRES_PASSWORD: kimi
          POSTGRES_DB: kimi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kimi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://kimi:kimi@localhost:5432/kimi?schema=public
      # Tests never call an LLM, but write paths stamp authorModel via the
      # fail-closed roleModel() (throws when KIMI_MODEL is unset — by design).
      # Locally vitest injects .env, which is gitignored, so CI needs a stamp
      # value of its own. A dummy is honest here: it's a label, not an endpoint.
      KIMI_MODEL: ci-dummy-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install   # not `npm ci`: a single-platform (macOS) lockfile can't be
                           #   reliably completed for Linux's esbuild/tsx optional deps
                           #   (@emnapi/*), and npm install reconciles cross-platform.
      - run: npm run db:generate
      - run: npm run db:migrate:deploy   # 0_init creates the vector/pg_trgm/pgcrypto extensions
      - run: npx tsc --noEmit
      - run: npm run lint   # eslint: no-floating-promises (error) + no-explicit-any (warn)
      - run: npm test
      - run: npm run scrub   # shape-layer de-id gate (private-word layer is local/pre-push)
